<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 790" width="460" height="790" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" role="img" aria-label="MIDI Hand architecture">
